version: '3.7'

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - ./backend/.env_local
    ports:
      - "5600:5432"
    networks:
      - app-network

  backend:
    image: python:3.11-slim-bullseye
    container_name: backend
    working_dir: /app
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "5800:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    command: [ "uvicorn", "app:app", "--reload", "--host", "0.0.0.0", "--port", "8000" ]
    networks:
      - app-network

  frontend:
    image: node:alpine
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5700:5173"
    command: sh -c "npm install && npm run dev -- --host"
    expose:
      - "5700"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
